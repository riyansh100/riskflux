[project]
name = "riskflux"
version = "0.1.0"
description = "Production-grade ML pipeline for loan default prediction on Lending Club data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "evidently>=0.7.23",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3.16.1",
    "nbconvert>=7.17.1",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.16.8",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]  # notebooks hold wide tables/markdown-ish strings; src/ keeps the 100-col limit

[tool.ruff.format]
exclude = ["*.ipynb"]  # notebooks are executed records; reformatting would desync code from outputs
