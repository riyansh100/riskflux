# Pipeline DAG: raw zip -> ingest -> clean -> split.
#
# `dvc repro` re-runs a stage only if one of its deps, params, or outs changed.
# Every riskflux module a stage imports is listed as a dep (enforced by
# tests/unit/test_dvc_pipeline.py), so a code change can't leave a stale output behind.
# Commands use plain `python`: run via `uv run dvc repro` so it resolves to the project venv.

stages:
  ingest:
    cmd: python -m riskflux.data.ingest
    deps:
      - data/raw/lending-club-20072020q1.zip
      - src/riskflux/data/ingest.py
      - src/riskflux/config.py
    outs:
      - data/interim/loans_raw.parquet

  clean:
    cmd: python -m riskflux.data.clean
    deps:
      - data/interim/loans_raw.parquet
      - src/riskflux/data/clean.py
      - src/riskflux/columns.py
      - src/riskflux/config.py
      - src/riskflux/schemas.py
    params:
      - population
    outs:
      - data/interim/loans_clean.parquet
      - data/interim/loans_aux.parquet

  split:
    cmd: python -m riskflux.data.split
    deps:
      - data/interim/loans_clean.parquet
      - src/riskflux/data/split.py
      - src/riskflux/columns.py
      - src/riskflux/config.py
      - src/riskflux/schemas.py
    params:
      - population  # split windows are validated against the population window
      - split
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
    metrics:
      - reports/split_stats.json:
          cache: false  # small JSON: committed to git so it diffs in PRs

  train:
    cmd: python -m riskflux.models.train
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/interim/loans_aux.parquet
      - src/riskflux/models/train.py
      - src/riskflux/models/calibration.py
      - src/riskflux/models/io.py
      - src/riskflux/models/metrics.py
      - src/riskflux/economics/cost.py
      - src/riskflux/features/engineer.py
      - src/riskflux/features/pipeline.py
      - src/riskflux/columns.py
      - src/riskflux/config.py
    params:
      - population  # term_months: contractual interest in the cost function
      - model
      - cost
    outs:
      - models/model.joblib
      - models/policy.json:
          cache: false  # small: committed so threshold changes show up in git diffs
    metrics:
      - reports/train_metrics.json:
          cache: false

  evaluate:
    cmd: python -m riskflux.models.evaluate
    deps:
      - models/model.joblib
      - models/policy.json
      - data/processed/test.parquet
      - data/interim/loans_aux.parquet
      - src/riskflux/models/evaluate.py
      - src/riskflux/models/io.py
      - src/riskflux/models/metrics.py
      - src/riskflux/economics/cost.py
      - src/riskflux/columns.py
      - src/riskflux/config.py
    params:
      - cost  # threshold grid for the hindsight comparison
    metrics:
      - reports/test_metrics.json:
          cache: false
    plots:
      - reports/calibration_test.csv:
          x: mean_predicted
          y: observed_rate
          cache: false

  ablation:
    cmd: python -m riskflux.models.ablation
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/interim/loans_aux.parquet
      - src/riskflux/models/ablation.py
      - src/riskflux/models/train.py
      - src/riskflux/models/calibration.py
      - src/riskflux/models/io.py
      - src/riskflux/models/metrics.py
      - src/riskflux/economics/cost.py
      - src/riskflux/features/engineer.py
      - src/riskflux/features/pipeline.py
      - src/riskflux/columns.py
      - src/riskflux/config.py
    params:
      - model
    metrics:
      - reports/ablation.json:
          cache: false

  replay_data:  # simulated production traffic for monitoring (Step 9)
    cmd: python -m riskflux.data.replay
    deps:
      - data/interim/loans_raw.parquet
      - src/riskflux/data/replay.py
      - src/riskflux/data/clean.py
      - src/riskflux/columns.py
      - src/riskflux/config.py
      - src/riskflux/schemas.py
    params:
      - population
      - monitoring
    outs:
      - data/monitoring/replay_loans.parquet
