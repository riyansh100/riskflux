# Pipeline parameters. DVC tracks this file (Step 5): changing a value re-runs only
# the stages that depend on it. Evidence for every value: notebooks/01_eda.ipynb.

population:
  term_months: 36
  application_type: Individual
  issue_start: "2013-01"  # derived from clock.as_of by retrain/plan.py (don't hand-edit)
  issue_end: "2017-04"    # = as_of - maturity: last cohort with >=98% of loans resolved (EDA §2)

split:                    # out-of-time; contiguous; inclusive months; derived from clock.as_of
  train: {start: "2013-01", end: "2015-12"}
  val:   {start: "2016-01", end: "2016-06"}
  test:  {start: "2016-07", end: "2017-04"}

model:
  seed: 42
  early_stopping_rounds: 100   # stop when val log-loss hasn't improved for 100 trees
  lightgbm:                    # baseline settings, not tuned (see DECISIONS: corners cut)
    n_estimators: 3000         # upper bound; early stopping picks the real number
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200     # >=200 loans per leaf: smooth probabilities, less overfit
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    deterministic: true        # same data + params -> byte-identical model (DVC reproducibility)
    force_row_wise: true
    verbose: -1

cost:
  threshold_grid: {start: 0.01, stop: 0.99, step: 0.005}

promotion:                     # champion/challenger rules (registry/promote.py)
  min_cost_improvement: 0.001  # challenger must cut dollar cost by >= 0.1% vs champion
  max_auc_drop: 0.005          # ...without losing more than 0.005 ROC-AUC
  max_ece: 0.02                # ...and must stay calibrated (cost math depends on it)

monitoring:
  replay: {start: "2017-05", end: "2020-09"}  # loans issued after the modeling window
  sample_per_month: 2000       # replayed loans per issue month (keeps a replay to minutes)
  seed: 42
  reference_sample: 20000      # loans sampled from the test period as the drift reference
  psi_threshold: 0.1           # a feature "drifts" at PSI >= 0.1 (industry: 0.1-0.25 watch, >0.25 act)
  drifted_share_alert: 0.3     # alert if >= 30% of model inputs drift in a month...
  prediction_psi_alert: 0.2    # ...or if the predicted-PD distribution itself shifts
  missing_share_alert: 0.1     # ...or if any input's missing rate moves by >= 10 points

clock:                         # simulated "today" (Step 10). Outcomes are known only for loans
  as_of: "2020-09"             # that matured by this date; retraining derives all windows from it.

retraining:
  data_snapshot: "2020-09"     # the Kaggle file's outcomes are as of here: the clock can't pass it
  maturity_months: 41          # 36-month term + 5-month buffer for late/modified loans (EDA: >=98% resolved)
  train_start: "2013-01"       # bureau wave-2 fields complete from here (EDA §3)
  val_months: 6
  test_months: 10              # newest matured window: out-of-time test AND promotion set

backtest:                      # what would retraining have been worth? (retrain/backtest.py)
  as_of: ["2018-09", "2019-09", "2020-09"]
