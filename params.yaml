# Pipeline parameters. DVC tracks this file (Step 5): changing a value re-runs only
# the stages that depend on it. Evidence for every value: notebooks/01_eda.ipynb.

population:
  term_months: 36
  application_type: Individual
  issue_start: "2013-01"  # bureau wave-2 fields fully populated from 2012-09 (EDA §3)
  issue_end: "2017-04"    # last cohort with >=98% of loans resolved (EDA §2)

split:                    # out-of-time; contiguous; inclusive months (EDA §10)
  train: {start: "2013-01", end: "2015-12"}
  val:   {start: "2016-01", end: "2016-06"}
  test:  {start: "2016-07", end: "2017-04"}

model:
  seed: 42
  early_stopping_rounds: 100   # stop when val log-loss hasn't improved for 100 trees
  lightgbm:                    # baseline settings, not tuned (see DECISIONS: corners cut)
    n_estimators: 3000         # upper bound; early stopping picks the real number
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200     # >=200 loans per leaf: smooth probabilities, less overfit
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    deterministic: true        # same data + params -> byte-identical model (DVC reproducibility)
    force_row_wise: true
    verbose: -1

cost:
  threshold_grid: {start: 0.01, stop: 0.99, step: 0.005}
